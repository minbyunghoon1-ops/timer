<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10초 타이머 (10-Second Timer)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
        }
        
        /* Smooth progress circle stroke animation */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.05s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Pulse glowing effect on final seconds */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.6)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.9)); }
        }

        .urgent-pulse {
            animation: pulse-red 0.5s infinite;
        }

        /* Glassmorphism card effect */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-between p-4 sm:p-6 select-none overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center mt-4">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-indigo-200">10초 타이머</h1>
        </div>
        <!-- Sound Toggle Button -->
        <button id="soundToggleBtn" class="p-2.5 rounded-full glass-card hover:bg-slate-700/60 transition-all text-slate-300 hover:text-white" title="음소거 토글">
            <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 6l-4 4H4v4h4l4 4V6z"></path>
            </svg>
            <svg id="soundOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
            </svg>
        </button>
    </header>

    <!-- Main Timer Display Block -->
    <main class="my-auto flex flex-col items-center justify-center w-full max-w-md">
        <div id="timerCard" class="glass-card w-full rounded-3xl p-8 sm:p-10 shadow-2xl flex flex-col items-center relative overflow-hidden transition-all duration-300">
            
            <!-- SVG Circular Progress Bar -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 220 220">
                    <!-- Background Circle -->
                    <circle 
                        cx="110" 
                        cy="110" 
                        r="92" 
                        stroke="rgba(255, 255, 255, 0.08)" 
                        stroke-width="12" 
                        fill="transparent">
                    </circle>
                    <!-- Progress Circle -->
                    <circle 
                        id="progressCircle"
                        cx="110" 
                        cy="110" 
                        r="92" 
                        stroke="url(#gradient)" 
                        stroke-width="12" 
                        stroke-linecap="round"
                        fill="transparent"
                        stroke-dasharray="578.05"
                        stroke-dashoffset="0"
                        class="progress-ring-circle">
                    </circle>
                    <!-- SVG Gradient Definition -->
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#818cf8" />
                            <stop offset="50%" stop-color="#6366f1" />
                            <stop offset="100%" stop-color="#3b82f6" />
                        </linearGradient>
                        <linearGradient id="gradientUrgent" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f87171" />
                            <stop offset="100%" stop-color="#ef4444" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Digital Time Counter -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <span id="timeDisplay" class="text-6xl sm:text-7xl font-extrabold tracking-tight font-mono text-white drop-shadow-md">
                        10.0
                    </span>
                    <span class="text-sm uppercase tracking-widest text-indigo-300/80 mt-1 font-semibold">초 (SEC)</span>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="w-full mt-8 flex flex-col gap-4">
                <!-- Action Buttons -->
                <div class="flex items-center justify-center gap-4">
                    <!-- Start / Pause Button -->
                    <button id="startPauseBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2 text-lg">
                        <svg id="playIcon" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pauseIcon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                        <span id="startPauseText">시작</span>
                    </button>

                    <!-- Reset Button -->
                    <button id="resetBtn" class="bg-slate-700/70 hover:bg-slate-600 active:scale-95 text-slate-200 hover:text-white font-semibold py-4 px-5 rounded-2xl transition-all flex items-center justify-center shadow-md">
                        <svg class="w-6 h-6 stroke-current" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>

                <!-- Quick Preset / Extension -->
                <div class="flex items-center justify-between text-xs text-slate-400 px-2 pt-2 border-t border-slate-700/50">
                    <span>단축키: <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-600 text-slate-300">Space</kbd> 시작/정지</span>
                    <span><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-600 text-slate-300">R</kbd> 리셋</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Status -->
    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        10-Second Timer Web App
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Configuration
        const TOTAL_TIME = 10.0; // Seconds
        let remainingTime = TOTAL_TIME;
        let timerInterval = null;
        let isRunning = false;
        let soundEnabled = true;

        // DOM Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseText = document.getElementById('startPauseText');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const resetBtn = document.getElementById('resetBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const timerCard = document.getElementById('timerCard');

        // Circle Circumference calculation: 2 * PI * r (r = 92)
        const RADIUS = 92;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        // Initialize SVG circle properties
        progressCircle.style.strokeDasharray = `${CIRCUMFERENCE}`;
        progressCircle.style.strokeDashoffset = '0';

        // Web Audio API Sound System
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(freq = 600, duration = 0.08, type = 'sine') {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error('Audio play error:', e);
            }
        }

        function playFinishSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        
                        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.4);
                    }, idx * 100);
                });
            } catch (e) {
                console.error('Finish sound error:', e);
            }
        }

        let lastBeepSecond = Math.ceil(TOTAL_TIME);

        function updateDisplay() {
            // Render text display (formatted with 1 decimal place)
            const displayValue = Math.max(0, remainingTime).toFixed(1);
            timeDisplay.textContent = displayValue;

            // Render Circle Progress Offset
            const progressRatio = remainingTime / TOTAL_TIME;
            const offset = CIRCUMFERENCE - (progressRatio * CIRCUMFERENCE);
            progressCircle.style.strokeDashoffset = Math.max(0, offset);

            // Change appearance on urgent last 3 seconds
            if (remainingTime <= 3.0 && remainingTime > 0) {
                progressCircle.setAttribute('stroke', 'url(#gradientUrgent)');
                timeDisplay.classList.add('text-red-400');
                timeDisplay.classList.remove('text-white');
            } else {
                progressCircle.setAttribute('stroke', 'url(#gradient)');
                timeDisplay.classList.remove('text-red-400');
                timeDisplay.classList.add('text-white');
            }

            // Countdown sound triggers on integer seconds
            const currentSecond = Math.ceil(remainingTime);
            if (isRunning && currentSecond !== lastBeepSecond && currentSecond > 0 && currentSecond <= 3) {
                playBeep(800, 0.1, 'sine'); // Higher tone beep for final 3 seconds
                lastBeepSecond = currentSecond;
            }
        }

        function startTimer() {
            if (isRunning) return;
            
            initAudio();

            if (remainingTime <= 0) {
                resetTimer();
            }

            isRunning = true;
            startPauseText.textContent = '일시정지';
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            startPauseBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
            startPauseBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');

            playBeep(523.25, 0.08); // Start sound tone

            const startTime = Date.now() - ((TOTAL_TIME - remainingTime) * 1000);

            timerInterval = setInterval(() => {
                const elapsedMs = Date.now() - startTime;
                remainingTime = Math.max(0, TOTAL_TIME - (elapsedMs / 1000));

                updateDisplay();

                if (remainingTime <= 0) {
                    onTimerComplete();
                }
            }, 30); // ~33fps smooth UI update
        }

        function pauseTimer() {
            if (!isRunning) return;
            
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;

            startPauseText.textContent = '계속';
            pauseIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');
            startPauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
            startPauseBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');

            playBeep(400, 0.08);
        }

        function resetTimer() {
            pauseTimer();
            remainingTime = TOTAL_TIME;
            lastBeepSecond = Math.ceil(TOTAL_TIME);
            
            startPauseText.textContent = '시작';
            timerCard.classList.remove('urgent-pulse');

            updateDisplay();
        }

        function onTimerComplete() {
            pauseTimer();
            remainingTime = 0;
            updateDisplay();

            // Trigger Finish Visuals & Audio
            timerCard.classList.add('urgent-pulse');
            playFinishSound();

            startPauseText.textContent = '다시 시작';

            // Auto clean pulse after 3 seconds
            setTimeout(() => {
                timerCard.classList.remove('urgent-pulse');
            }, 3000);
        }

        // Event Listeners
        startPauseBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetTimer);

        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundOnIcon.classList.remove('hidden');
                soundOffIcon.classList.add('hidden');
                playBeep(600, 0.05);
            } else {
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
            }
        });

        // Keyboard Shortcuts (Space bar to toggle, R to reset)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                startPauseBtn.click();
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetTimer();
            }
        });

        // Initial setup on load
        updateDisplay();
    </script>
</body>
</html>
